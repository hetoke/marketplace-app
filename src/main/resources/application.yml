spring:
  application:
    name: marketplace

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace}
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:change-this-to-a-256-bit-access-secret-in-production}
    refresh-secret: ${JWT_REFRESH_SECRET:change-this-to-a-256-bit-refresh-secret-in-production}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  product:
    default-page-size: 20
    max-page-size: 100
  supabase:
    project-url: ${SUPABASE_PROJECT_URL:https://placeholder.supabase.co}
    public-url: ${SUPABASE_PUBLIC_URL:${SUPABASE_PROJECT_URL:https://placeholder.supabase.co}}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:placeholder}
    bucket-name: ${SUPABASE_BUCKET_NAME:marketplace-images}
  sepay:
    merchant-id: ${SEPAY_MERCHANT_ID:}
    secret-key: ${SEPAY_SECRET_KEY:}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    environment: ${SEPAY_ENVIRONMENT:sandbox}
    success-url: ${SEPAY_SUCCESS_URL:http://localhost:3000/orders/{orderId}?payment=success}
    error-url: ${SEPAY_ERROR_URL:http://localhost:3000/orders/{orderId}?payment=error}
    cancel-url: ${SEPAY_CANCEL_URL:http://localhost:3000/orders/{orderId}?payment=cancelled}
  webhook:
    secret: ${WEBHOOK_SECRET:changeme}
  upload:
    max-images-per-product: ${UPLOAD_MAX_IMAGES_PER_PRODUCT:10}
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE:5242880}
    allowed-content-types: ${UPLOAD_ALLOWED_TYPES:image/jpeg,image/png,image/webp,image/gif}
    signed-url-expiry-hours: ${UPLOAD_SIGNED_URL_EXPIRY_HOURS:2}

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false
