spring:
  application:
    name: marketplace

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms
      repositories:
        enabled: false

  jackson:
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  cache:
    enabled: true
  rate-limit:
    enabled: true
    auth:
      capacity: 10
      refill-tokens: 10
      refill-duration-minutes: 1
    orders:
      capacity: 20
      refill-tokens: 20
      refill-duration-minutes: 1
    payments:
      capacity: 10
      refill-tokens: 10
      refill-duration-minutes: 1
    reviews:
      capacity: 10
      refill-tokens: 10
      refill-duration-minutes: 1
    uploads:
      capacity: 5
      refill-tokens: 5
      refill-duration-minutes: 1
    password:
      capacity: 5
      refill-tokens: 5
      refill-duration-minutes: 1
  frontend-url: ${FRONTEND_URL}
  mail:
    from: ${MAIL_FROM}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  product:
    default-page-size: 20
    max-page-size: 100
  supabase:
    project-url: ${SUPABASE_PROJECT_URL}
    public-url: ${SUPABASE_PUBLIC_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
    bucket-name: ${SUPABASE_BUCKET_NAME}
  sepay:
    merchant-id: ${SEPAY_MERCHANT_ID}
    secret-key: ${SEPAY_SECRET_KEY}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET}
    environment: ${SEPAY_ENVIRONMENT}
    success-url: ${SEPAY_SUCCESS_URL}
    error-url: ${SEPAY_ERROR_URL}
    cancel-url: ${SEPAY_CANCEL_URL}
  webhook:
    secret: ${WEBHOOK_SECRET}
  oidc:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
      scopes: openid email profile
  upload:
    max-images-per-product: ${UPLOAD_MAX_IMAGES_PER_PRODUCT}
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE}
    allowed-content-types: ${UPLOAD_ALLOWED_TYPES}
    signed-url-expiry-hours: ${UPLOAD_SIGNED_URL_EXPIRY_HOURS}

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 25
    username:
    password:
