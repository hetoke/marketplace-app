spring:
  application:
    name: marketplace

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace}
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false

  cache:
    type: redis

  jackson:
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  rate-limit:
    enabled: true
    auth:
      capacity: 10
      refill-tokens: 10
      refill-duration-minutes: 1
    orders:
      capacity: 20
      refill-tokens: 20
      refill-duration-minutes: 1
    payments:
      capacity: 10
      refill-tokens: 10
      refill-duration-minutes: 1
    reviews:
      capacity: 10
      refill-tokens: 10
      refill-duration-minutes: 1
    uploads:
      capacity: 5
      refill-tokens: 5
      refill-duration-minutes: 1
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@marketplace.com}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:change-this-to-a-256-bit-access-secret-in-production}
    refresh-secret: ${JWT_REFRESH_SECRET:change-this-to-a-256-bit-refresh-secret-in-production}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  product:
    default-page-size: 20
    max-page-size: 100
  supabase:
    project-url: ${SUPABASE_PROJECT_URL:https://placeholder.supabase.co}
    public-url: ${SUPABASE_PUBLIC_URL:${SUPABASE_PROJECT_URL:https://placeholder.supabase.co}}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:placeholder}
    bucket-name: ${SUPABASE_BUCKET_NAME:marketplace-images}
  sepay:
    merchant-id: ${SEPAY_MERCHANT_ID:}
    secret-key: ${SEPAY_SECRET_KEY:}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    environment: ${SEPAY_ENVIRONMENT:sandbox}
    success-url: ${SEPAY_SUCCESS_URL:http://localhost:3000/orders/{orderId}?payment=success}
    error-url: ${SEPAY_ERROR_URL:http://localhost:3000/orders/{orderId}?payment=error}
    cancel-url: ${SEPAY_CANCEL_URL:http://localhost:3000/orders/{orderId}?payment=cancelled}
  webhook:
    secret: ${WEBHOOK_SECRET:changeme}
  oidc:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oidc/callback}
      scopes: openid email profile
  upload:
    max-images-per-product: ${UPLOAD_MAX_IMAGES_PER_PRODUCT:10}
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE:5242880}
    allowed-content-types: ${UPLOAD_ALLOWED_TYPES:image/jpeg,image/png,image/webp,image/gif}
    signed-url-expiry-hours: ${UPLOAD_SIGNED_URL_EXPIRY_HOURS:2}

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 25
    username:
    password:
